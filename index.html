<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zoho CRM – Widget Chatwoot</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    /* ── CONFIGURAÇÃO: edite apenas estas 2 variáveis ── */
    /* Depois de obter o token de acesso do Zoho, cole aqui */
    :root {
      --zoho-token: "SEU_ACCESS_TOKEN_AQUI";
      --zoho-domain: "https://www.zohoapis.com"; /* ou .eu / .in conforme sua região */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f4f6f9;
      color: #1a1d23;
      min-height: 100vh;
      padding: 0;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e9f0;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #e84f37 0%, #f7a800 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo svg { width: 16px; height: 16px; fill: #fff; }

    header h1 { font-size: 14px; font-weight: 600; color: #1a1d23; letter-spacing: -0.2px; }
    header .sub { font-size: 11px; color: #8a92a0; margin-top: 1px; }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ccc;
      margin-left: auto;
      transition: background .3s;
    }
    .status-dot.connected { background: #22c55e; }
    .status-dot.error { background: #ef4444; }

    main { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    /* ── CARD ── */
    .card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e9f0;
      overflow: hidden;
    }

    .card-header {
      padding: 10px 14px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: #8a92a0;
      border-bottom: 1px solid #f0f2f6;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-header svg { width: 12px; height: 12px; }

    .card-body { padding: 14px; }

    /* ── CONTACT HERO ── */
    .contact-hero {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
    }

    .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }

    .contact-info h2 { font-size: 15px; font-weight: 600; color: #1a1d23; }
    .contact-info .role { font-size: 12px; color: #8a92a0; margin-top: 2px; }

    /* ── FIELD ROWS ── */
    .field-list { display: flex; flex-direction: column; gap: 0; }

    .field-row {
      display: flex;
      align-items: flex-start;
      padding: 9px 14px;
      gap: 10px;
      border-bottom: 1px solid #f4f6f9;
      transition: background .15s;
    }
    .field-row:last-child { border-bottom: none; }
    .field-row:hover { background: #fafbfc; }

    .field-icon {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: #f4f6f9;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .field-icon svg { width: 13px; height: 13px; color: #667eea; }

    .field-label { font-size: 10px; color: #8a92a0; font-weight: 500; letter-spacing: .3px; }
    .field-value { font-size: 13px; color: #1a1d23; font-weight: 500; margin-top: 1px; word-break: break-all; }
    .field-value.empty { color: #bdc3cc; font-style: italic; font-weight: 400; font-size: 12px; }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-blue  { background: #dbeafe; color: #1d4ed8; }
    .badge-gray  { background: #f1f5f9; color: #64748b; }
    .badge-orange{ background: #ffedd5; color: #c2410c; }

    /* ── LINK BUTTON ── */
    .btn-zoho {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #e84f37 0%, #f7a800 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .2s, transform .1s;
      margin-top: 4px;
    }
    .btn-zoho:hover { opacity: .9; transform: translateY(-1px); }
    .btn-zoho svg { width: 14px; height: 14px; fill: #fff; }

    /* ── STATES ── */
    .state-box {
      padding: 32px 20px;
      text-align: center;
      color: #8a92a0;
    }
    .state-box .icon { font-size: 32px; margin-bottom: 10px; }
    .state-box p { font-size: 13px; line-height: 1.5; }
    .state-box small { font-size: 11px; color: #bdc3cc; font-family: 'DM Mono', monospace; display: block; margin-top: 6px; }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #e5e9f0;
      border-top-color: #e84f37;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── CONFIG WARNING ── */
    .config-warn {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 12px;
      color: #92400e;
      line-height: 1.5;
    }
    .config-warn strong { display: block; margin-bottom: 4px; font-size: 13px; }

    code {
      font-family: 'DM Mono', monospace;
      background: #f1f5f9;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 11px;
      color: #e84f37;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <!-- Zoho Z icon -->
    <svg viewBox="0 0 24 24"><path d="M4 4h16v2.5L9.5 18H20v2H4v-2.5L14.5 6H4V4z"/></svg>
  </div>
  <div>
    <h1>Zoho CRM</h1>
    <div class="sub">Widget para Chatwoot</div>
  </div>
  <div class="status-dot" id="statusDot" title="Status da conexão"></div>
</header>

<main id="main">
  <div class="state-box">
    <div class="spinner"></div>
    <p>Aguardando conversa do Chatwoot…</p>
  </div>
</main>

<script>
  // ════════════════════════════════════════════════
  //  ⚙️  CONFIGURAÇÃO — edite estas 2 linhas
  // ════════════════════════════════════════════════
  const ZOHO_ACCESS_TOKEN = "1000.9bd9efb65200988edb218cae18a45e3d.50c55705e9d19292d47810f429c4ff82";
  const ZOHO_API_BASE     = "https://www.zohoapis.com"; // troque por .eu ou .in se necessário
  // ════════════════════════════════════════════════

  const dot  = document.getElementById("statusDot");
  const main = document.getElementById("main");

  // — Solicita contexto ao Chatwoot
  window.parent.postMessage("chatwoot-dashboard-app:fetch-info", "*");

  // — Escuta resposta do Chatwoot
  window.addEventListener("message", async (e) => {
    if (!e.data || typeof e.data !== "object") return;
    if (e.data.event !== "appContext") return;

    const { contact, conversation } = e.data.data || {};
    if (!contact) { showState("⚠️", "Nenhum contato encontrado nesta conversa."); return; }

    renderLoading(contact);
    await searchZoho(contact);
  });

  // — Busca no Zoho CRM por email ou telefone
  async function searchZoho(contact) {
    if (ZOHO_ACCESS_TOKEN === "SEU_ACCESS_TOKEN_AQUI") {
      showConfigWarning();
      return;
    }

    const email = contact.email;
    const phone = contact.phone_number;

    if (!email && !phone) {
      showState("📭", "Contato sem e-mail ou telefone para buscar no Zoho.", contact.name);
      return;
    }

    try {
      // Tenta buscar por e-mail nos Contatos
      let record = null;

      if (email) {
        record = await fetchZoho("Contacts", `Email:equals:${email}`);
      }

      // Se não achou, tenta por telefone
      if (!record && phone) {
        record = await fetchZoho("Contacts", `Phone:equals:${phone}`);
      }

      // Tenta nos Leads se não achou nos Contacts
      if (!record && email) {
        record = await fetchZoho("Leads", `Email:equals:${email}`);
      }

      if (record) {
        dot.classList.add("connected");
        renderRecord(record, contact);
      } else {
        dot.classList.add("error");
        showState("🔍", "Nenhum registro encontrado no Zoho CRM.", `Buscado: ${email || phone}`);
      }
    } catch (err) {
      dot.classList.add("error");
      showState("❌", "Erro ao consultar o Zoho CRM.", err.message);
    }
  }

  async function fetchZoho(module, criteria) {
    const url = `${ZOHO_API_BASE}/crm/v3/${module}/search?criteria=(${criteria})&fields=First_Name,Last_Name,Email,Phone,Mobile,Account_Name,Lead_Status,Lead_Source,Owner,Created_Time,id`;
    const res = await fetch(url, {
      headers: { Authorization: `Zoho-oauthtoken ${ZOHO_ACCESS_TOKEN}` }
    });
    if (res.status === 401) throw new Error("Token inválido ou expirado (401)");
    if (!res.ok) return null;
    const json = await res.json();
    return json.data?.[0] || null;
  }

  // ── RENDERIZAÇÕES ──────────────────────────────

  function renderLoading(contact) {
    main.innerHTML = `
      <div class="card">
        <div class="contact-hero">
          <div class="avatar">${initials(contact.name || "?")}</div>
          <div class="contact-info">
            <h2>${esc(contact.name || "Sem nome")}</h2>
            <div class="role">Buscando no Zoho CRM…</div>
          </div>
        </div>
      </div>
      <div class="state-box"><div class="spinner"></div><p>Consultando registros…</p></div>
    `;
  }

  function renderRecord(r, contact) {
    const name     = [r.First_Name, r.Last_Name].filter(Boolean).join(" ") || contact.name || "—";
    const email    = r.Email    || contact.email          || null;
    const phone    = r.Phone    || r.Mobile               || contact.phone_number || null;
    const company  = r.Account_Name?.name || r.Account_Name || null;
    const status   = r.Lead_Status  || null;
    const source   = r.Lead_Source  || null;
    const owner    = r.Owner?.name  || null;
    const recordId = r.id;
    const module   = r.Account_Name !== undefined ? "Contacts" : "Leads";
    const zohoUrl  = `https://crm.zoho.com/crm/org/tab/${module}/${recordId}`;

    const statusBadge = status
      ? `<span class="badge ${statusColor(status)}">${esc(status)}</span>`
      : `<span class="field-value empty">—</span>`;

    main.innerHTML = `
      <div class="card">
        <div class="contact-hero">
          <div class="avatar">${initials(name)}</div>
          <div class="contact-info">
            <h2>${esc(name)}</h2>
            <div class="role">${esc(company || module === "Leads" ? "Lead" : "Contato")}</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Informações de Contato
        </div>
        <div class="field-list">
          ${fieldRow("✉️", "E-mail", email)}
          ${fieldRow("📞", "Telefone", phone)}
          ${fieldRow("🏢", "Empresa", company)}
          ${fieldRow("👤", "Responsável", owner)}
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          CRM
        </div>
        <div class="field-list">
          <div class="field-row">
            <div class="field-icon">🏷️</div>
            <div>
              <div class="field-label">STATUS</div>
              <div style="margin-top:3px">${statusBadge}</div>
            </div>
          </div>
          ${fieldRow("📡", "Origem", source)}
        </div>
      </div>

      <div class="card" style="padding:14px">
        <a href="${zohoUrl}" target="_blank" class="btn-zoho">
          <svg viewBox="0 0 24 24"><path d="M4 4h16v2.5L9.5 18H20v2H4v-2.5L14.5 6H4V4z"/></svg>
          Abrir no Zoho CRM
        </a>
      </div>
    `;
  }

  function fieldRow(icon, label, value) {
    const display = value
      ? `<div class="field-value">${esc(value)}</div>`
      : `<div class="field-value empty">Não informado</div>`;
    return `
      <div class="field-row">
        <div class="field-icon">${icon}</div>
        <div>
          <div class="field-label">${label.toUpperCase()}</div>
          ${display}
        </div>
      </div>`;
  }

  function showState(icon, msg, detail) {
    main.innerHTML = `
      <div class="card">
        <div class="state-box">
          <div class="icon">${icon}</div>
          <p>${msg}</p>
          ${detail ? `<small>${esc(detail)}</small>` : ""}
        </div>
      </div>`;
  }

  function showConfigWarning() {
    main.innerHTML = `
      <div class="config-warn">
        <strong>⚙️ Configure seu Access Token</strong>
        Edite o arquivo <code>index.html</code> e substitua
        <code>SEU_ACCESS_TOKEN_AQUI</code> pelo seu token da API do Zoho CRM.<br><br>
        Consulte o guia de configuração para obter o token.
      </div>`;
  }

  // ── HELPERS ───────────────────────────────────
  function initials(name) {
    return (name || "?").split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
  }
  function esc(str) {
    return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function statusColor(s) {
    s = (s || "").toLowerCase();
    if (s.includes("qualif") || s.includes("won"))    return "badge-green";
    if (s.includes("contact") || s.includes("demo"))  return "badge-blue";
    if (s.includes("lost") || s.includes("dead"))     return "badge-gray";
    return "badge-orange";
  }
</script>
</body>
</html>
